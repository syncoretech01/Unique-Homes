<section class="section showcase" data-section="showcase" id="showcase" aria-labelledby="showcase-title">
  <div class="showcase__stage" data-stage>

    <div class="showcase__ghost" aria-hidden="true">
      <span class="showcase__ghost-num" data-ghost>01</span>
    </div>

    <div class="shell showcase__head-shell">
      <div class="sec-head showcase__head">
        <p class="sec-head__label eyebrow">Selected work</p>
        <h2 class="sec-head__title t-h2 showcase__title" id="showcase-title" data-split="lines">
          Six recent projects, drawn and engineered from the same model.
        </h2>
        <div class="sec-head__aside showcase__aside" data-reveal="up" data-delay="0.12">
          <p class="t-small showcase__aside-copy">
            Architecture, civil and visualisation run in parallel here — so the site plan,
            the structure and the renderings never disagree.
          </p>
          <a class="showcase__all link-u" href="/projects/">
            <span class="showcase__all-label">All projects</span>
            <span class="showcase__all-count" data-all-count aria-hidden="true">08</span>
          </a>
        </div>
      </div>
    </div>

    <div class="showcase__viewport" data-viewport>
      <div class="showcase__track" data-track></div>
    </div>

    <div class="shell showcase__foot">
      <div class="showcase__progress">
        <p class="showcase__count">
          <span class="showcase__count-now" data-current>01</span>
          <span class="showcase__count-sep" aria-hidden="true">/</span>
          <span class="showcase__count-all" data-total>06</span>
        </p>
        <div class="showcase__rail">
          <span class="showcase__rail-fill" data-fill></span>
          <span class="showcase__ticks" data-ticks aria-hidden="true"></span>
        </div>
        <p class="showcase__hint" data-hint>Scroll to advance</p>
      </div>
    </div>

  </div>
</section>
