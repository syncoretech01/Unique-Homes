<section class="section services-layers" data-section="services-layers" id="services-layers" aria-labelledby="services-layers-title">
  <div class="services-layers__field" data-sl-field aria-hidden="true"></div>

  <div class="shell services-layers__head-shell">
    <header class="sec-head services-layers__head">
      <div class="sec-head__label">
        <span class="eyebrow">Services</span>
      </div>
      <div class="sec-head__title">
        <h2 class="t-h2" id="services-layers-title" data-split="lines">Three disciplines,<br />one <em>coordinated model</em></h2>
      </div>
      <div class="sec-head__aside">
        <p class="t-small services-layers__intro" data-reveal="up" data-delay="0.12">Drawings, site and visualisation come off a single file. Change a beam and the schedule, the section and the render all move with it.</p>
        <a class="link-u services-layers__all" href="/services/" data-reveal="up" data-delay="0.22">All services</a>
      </div>
    </header>
  </div>

  <div class="services-layers__pin" data-sl-pin>
    <div class="shell services-layers__stage">

      <aside class="sl-rail" data-sl-rail aria-hidden="true">
        <p class="sl-rail__count t-num">
          <span class="sl-rail__now" data-sl-now>01</span>
          <span class="sl-rail__dash">—</span>
          <span class="sl-rail__total" data-sl-total>03</span>
        </p>
        <div class="sl-rail__track">
          <span class="sl-rail__fill" data-sl-fill></span>
          <ol class="sl-rail__ticks" data-sl-ticks></ol>
        </div>
        <span class="sl-rail__legend">Layers</span>
      </aside>

      <div class="sl-deck" data-sl-deck></div>

    </div>
  </div>
</section>
