<section class="section journal-preview" data-section="journal-preview" id="journal-preview" aria-labelledby="journal-preview-title">
  <div class="shell">

    <div class="sec-head journal-preview__head">
      <div class="sec-head__label">
        <p class="eyebrow" data-reveal="fade">Journal</p>
      </div>

      <div class="sec-head__title">
        <h2 class="t-h2 journal-preview__heading" id="journal-preview-title" data-split="lines">Notes from the drawing board.</h2>
        <p class="t-lead journal-preview__lede" data-reveal="up" data-delay="0.1">Field notes on documentation, site strategy and visualisation — written between drawing sets, from projects that are on their way to being built.</p>
      </div>

      <div class="sec-head__aside journal-preview__aside">
        <a class="journal-preview__all" href="/journal/" data-split-hover-host data-reveal="fade" data-delay="0.18">
          <span data-split-hover>All entries</span>
          <span class="journal-preview__all-arrow" aria-hidden="true"><svg viewBox="0 0 10 10" focusable="false"><path d="M2 8 8 2M3.4 2H8v4.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" /></svg></span>
        </a>
      </div>
    </div>

    <div class="journal-preview__index">
      <ol class="journal-preview__list" data-journal-list data-cursor="hide"></ol>
      <span class="journal-preview__rule journal-preview__rule--foot" aria-hidden="true"></span>
    </div>

  </div>

  <div class="journal-preview__card" data-journal-card aria-hidden="true">
    <span class="journal-preview__card-art" data-journal-art></span>
    <span class="journal-preview__card-art" data-journal-art></span>
    <span class="journal-preview__card-foot">
      <span class="journal-preview__card-cat" data-journal-card-cat></span>
      <span class="journal-preview__card-time" data-journal-card-time></span>
    </span>
  </div>
</section>
