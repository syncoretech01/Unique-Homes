<section class="section gallery3d" data-section="gallery3d" id="gallery3d" aria-labelledby="gallery3d-title">
  <div class="shell">
    <header class="sec-head above-gl">
      <div class="sec-head__label">
        <p class="eyebrow">In-house visualisation</p>
      </div>
      <div class="sec-head__title">
        <h2 class="t-h2" id="gallery3d-title" data-split="lines">The house, <em>photographed</em> before it exists.</h2>
      </div>
      <div class="sec-head__aside gallery3d__aside">
        <p class="t-small" data-reveal="up" data-delay="0.1">Renders come off the same coordinated model as the construction set, so what a client approves is what gets built.</p>
        <a class="link-u t-mono gallery3d__service-link" href="/services/#3d-renderings" data-reveal="up" data-delay="0.18">
          3D Renderings
          <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2 10 10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </a>
      </div>
    </header>
  </div>

  <div class="gallery3d__viewport">
    <div class="gallery3d__grid" aria-hidden="true"></div>

    <div class="gallery3d__stage gl-slot"
         data-cursor="drag"
         data-cursor-text="Drag"
         tabindex="0"
         role="group"
         aria-roledescription="carousel"
         aria-label="Three-dimensional visualisation carousel — use the left and right arrow keys to change project">
      <div class="gl-slot__fallback gallery3d__fallback" data-lenis-prevent></div>
    </div>

    <p class="gallery3d__hint above-gl" aria-hidden="true">
      <svg viewBox="0 0 18 8" width="18" height="8" focusable="false"><path d="M17 4H1m0 0 3.2-3M1 4l3.2 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="square"/></svg>
      <span>Drag to rotate</span>
      <svg viewBox="0 0 18 8" width="18" height="8" focusable="false"><path d="M1 4h16m0 0-3.2-3M17 4l-3.2 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="square"/></svg>
    </p>
  </div>

  <div class="shell">
    <div class="gallery3d__panel above-gl">
      <div class="gallery3d__caption">
        <p class="t-mono gallery3d__cap-service" data-g3="service">3D Visualisation</p>
        <p class="gallery3d__cap-name" data-g3="name">Ridge House</p>
        <p class="t-mono gallery3d__cap-meta" data-g3="meta">
          <span data-g3="location">Dripping Springs, TX</span>
          <span class="gallery3d__slash" aria-hidden="true">/</span>
          <span data-g3="year">2025</span>
          <span class="gallery3d__slash" aria-hidden="true">/</span>
          <span data-g3="type">New build</span>
        </p>
      </div>

      <div class="gallery3d__controls">
        <div class="gallery3d__nav">
          <button class="gallery3d__btn" type="button" data-g3-step="-1" aria-label="Previous project">
            <svg viewBox="0 0 20 12" width="20" height="12" aria-hidden="true" focusable="false"><path d="M19 6H1m0 0 5-5M1 6l5 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/></svg>
          </button>
          <p class="t-num gallery3d__readout">
            <span data-g3="current">01</span>
            <span class="gallery3d__readout-sep" aria-hidden="true">/</span>
            <span class="gallery3d__readout-total" data-g3="total">06</span>
          </p>
          <button class="gallery3d__btn" type="button" data-g3-step="1" aria-label="Next project">
            <svg viewBox="0 0 20 12" width="20" height="12" aria-hidden="true" focusable="false"><path d="M1 6h18m0 0-5-5m5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/></svg>
          </button>
        </div>
        <div class="gallery3d__dots" data-g3="dots" role="group" aria-label="Choose a project"></div>
      </div>
    </div>
  </div>

  <p class="u-sr" data-g3="live" aria-live="polite"></p>
  <nav class="u-sr gallery3d__sr" data-g3="srnav" aria-label="Projects shown in the visualisation carousel"></nav>
</section>
