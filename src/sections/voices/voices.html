<section class="section voices" data-section="voices" id="voices" aria-labelledby="voices-title">
  <div class="shell">

    <div class="sec-head voices__head">
      <div class="sec-head__label">
        <p class="eyebrow">In their words</p>
      </div>
      <div class="sec-head__title">
        <h2 class="t-h2 voices__title" id="voices-title" data-split="lines">Clients and builders,<br />on the record.</h2>
      </div>
      <div class="sec-head__aside">
        <p class="t-small voices__note" data-reveal="up" data-delay="0.14">Four projects, four people who had to live with the drawings. Every quote opens the set it came from.</p>
      </div>
    </div>

    <div class="voices__slider" data-voices-slider>

      <div class="voices__stage" data-voices-stage role="group" aria-roledescription="carousel" aria-label="Client and contractor testimonials">

        <div class="voices__col voices__col--quote">
          <span class="voices__ghost" aria-hidden="true">
            <span class="voices__ghost-num" data-voices-ghost="0">01</span>
            <span class="voices__ghost-num" data-voices-ghost="1"></span>
          </span>

          <div class="voices__quote-wrap" data-voices-quote-wrap>
            <figure class="voices__figure">
              <blockquote class="voices__quote">
                <p class="voices__quote-text" data-voices-quote>&#8220;The set went through review on the first submittal. In eleven years of building in this county, that had never happened to me.&#8221;</p>
              </blockquote>

              <figcaption class="voices__attrib">
                <p class="voices__author" data-voices-author>Grant Mueller</p>
                <p class="voices__role" data-voices-role>General Contractor &#183; Mueller Build Co.</p>
              </figcaption>
            </figure>

            <a class="voices__project" data-voices-link href="/projects/#ridge-house" aria-label="Open the Ridge House project">
              <span class="voices__project-name link-u" data-voices-project>Ridge House</span>
              <span class="voices__project-arrow" aria-hidden="true">&#8594;</span>
            </a>
          </div><!-- /.voices__quote-wrap -->
        </div>

        <div class="voices__col voices__col--art">
          <div class="voices__frame" data-voices-frame data-cursor="drag" aria-hidden="true" data-reveal="clip" data-duration="1.25">
            <div class="voices__layer" data-voices-layer="0">
              <div class="voices__layer-art" data-voices-plate="0"></div>
            </div>
            <div class="voices__layer" data-voices-layer="1">
              <div class="voices__layer-art" data-voices-plate="1"></div>
            </div>
            <span class="voices__sweep" data-voices-sweep></span>
            <span class="voices__ticks"></span>
          </div>

          <div class="voices__art-meta" data-reveal="up" data-delay="0.1">
            <span class="voices__art-name" data-voices-meta-a>Ridge House</span>
            <span class="voices__art-place" data-voices-meta-b>Dripping Springs, TX &#183; 2025</span>
          </div>
        </div>

      </div>

      <div class="voices__bar">
        <div class="voices__nav-group">
          <button class="voices__nav" type="button" data-voices-prev data-magnetic="0.24" aria-label="Previous testimonial">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true" focusable="false">
              <path d="M14.5 5 7.5 12l7 7" />
            </svg>
          </button>
          <button class="voices__nav" type="button" data-voices-next data-magnetic="0.24" aria-label="Next testimonial">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true" focusable="false">
              <path d="M9.5 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <div class="voices__rail" aria-hidden="true">
          <span class="voices__rail-fill" data-voices-rail></span>
        </div>

        <p class="voices__count t-num" aria-hidden="true">
          <span data-voices-current>01</span><span class="voices__count-sep">/</span><span data-voices-total>04</span>
        </p>
      </div>

      <p class="u-sr" role="status" aria-live="polite" data-voices-status></p>

    </div>

    <div class="voices__clients">
      <p class="voices__clients-label">Worked with</p>
      <ul class="voices__clients-list" data-voices-clients></ul>
    </div>

  </div>
</section>
