<section class="section process-columns" data-section="process-columns" id="process-columns" aria-labelledby="process-columns-title">
  <div class="shell">
    <div class="sec-head process-columns__head">
      <div class="sec-head__label">
        <p class="eyebrow">How it works</p>
      </div>
      <div class="sec-head__title">
        <h2 class="t-h2" id="process-columns-title" data-split="lines">Six steps, in this order.</h2>
      </div>
      <div class="sec-head__aside">
        <p class="t-small process-columns__lede" data-reveal="up" data-delay="0.12">
          Roughly eleven weeks from the first site walk to a submitted permit set. Each step closes
          before the next one opens, so nothing is drawn twice.
        </p>
      </div>
    </div>
  </div>

  <div class="process-columns__scroller" data-pc-scroller>
    <div class="process-columns__stage">
      <div class="process-columns__inner">
        <div class="process-columns__rail" data-pc-rail role="group" aria-label="Jump to a step"></div>
        <div class="process-columns__view" data-pc-view>
          <div class="process-columns__field" data-pc-field aria-hidden="true"></div>
          <div class="process-columns__scrim" aria-hidden="true"></div>
          <div class="process-columns__panel">
            <ol class="process-columns__steps" data-pc-steps role="list"></ol>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
